<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <!-- 画面の拡大を止める(iPhoneで入力欄を押したときのズーム対策) -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>NAGU-GROOVE Rhythm Project</title>

  <!-- PWA:ホーム画面に追加したときの設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NAGU-GROOVE">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    /* ゲーム画面を、画面いっぱいに広げる */
    #unity-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000000;
      outline: none;
      touch-action: none;
    }
    /* 読み込み中の表示 */
    #loading {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
    }
    #loading-bar {
      width: 60%;
      max-width: 400px;
      height: 6px;
      margin: 14px auto 0;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      overflow: hidden;
    }
    #loading-fill {
      width: 0%;
      height: 100%;
      background: #8cc8ff;
    }
  </style>

  <script>
    // オフライン用の仕組みを登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js');
      });
    }

    // Android:「ホーム画面に追加」ボタンを出す
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      if (document.getElementById('install-btn')) return;

      var btn = document.createElement('button');
      btn.id = 'install-btn';
      btn.textContent = 'ホーム画面に追加';
      btn.style.cssText =
        'position:fixed;top:12px;right:12px;z-index:9999;padding:10px 18px;' +
        'font-size:16px;border:none;border-radius:20px;background:#ffffff;' +
        'color:#2A3A5A;box-shadow:0 2px 8px rgba(0,0,0,0.3);';
      btn.onclick = function () {
        btn.remove();
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
      };
      document.body.appendChild(btn);

      // 15秒たったら、ボタンは自動で消える(ゲームの邪魔をしないため)
      setTimeout(function () { btn.remove(); }, 15000);
    });

    window.addEventListener('appinstalled', function () {
      var btn = document.getElementById('install-btn');
      if (btn) btn.remove();
    });
  </script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loading">
    NOW LOADING... <span id="loading-pct">0</span>%
    <div id="loading-bar"><div id="loading-fill"></div></div>
  </div>

  <script src="Build/NAGU_wab.loader.js"></script>
  <script>
    var canvas = document.querySelector('#unity-canvas');
    var config = {
      dataUrl: "Build/NAGU_wab.data",
      frameworkUrl: "Build/NAGU_wab.framework.js",
      codeUrl: "Build/NAGU_wab.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "NAGUWAVE",
      productName: "NAGU-GROOVE Rhythm Project",
      productVersion: "1.0",
      // 画面の細かさの上限(スマホで重くならないように2倍まで)
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    createUnityInstance(canvas, config, function (progress) {
      var pct = Math.round(progress * 100);
      document.getElementById('loading-pct').textContent = pct;
      document.getElementById('loading-fill').style.width = pct + '%';
    }).then(function () {
      document.getElementById('loading').style.display = 'none';
    }).catch(function (message) {
      alert(message);
    });
  </script>
</body>
</html>
